<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>应急翻译 — 留学工具箱</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f97316">
    <style>
        .translate-area {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }
        .lang-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 0.875rem;
            font-weight: 600;
        }
        .lang-selector select {
            padding: 6px 10px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 0.875rem;
            background: var(--bg);
        }
        .swap-btn {
            width: 32px; height: 32px;
            border-radius: 50%;
            border: 2px solid var(--border);
            background: var(--bg);
            font-size: 1rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .translate-input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 1rem;
            margin-bottom: 8px;
            resize: none;
            font-family: inherit;
        }
        .translate-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(249,115,22,0.1);
        }
        .translate-result {
            background: var(--primary-ghost);
            border-radius: var(--radius-sm);
            padding: 14px;
            margin-top: 8px;
            display: none;
        }
        .translate-result .ru-text {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 6px;
        }
        .translate-result .actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .action-btn {
            padding: 6px 14px;
            border: 1.5px solid var(--border);
            border-radius: 20px;
            background: #fff;
            font-size: 0.8125rem;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.15s;
        }
        .action-btn:active { background: var(--primary-light); border-color: var(--primary); }
        .search-box {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.9375rem;
            margin-bottom: 14px;
            background: var(--card-bg);
        }
        .search-box:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(249,115,22,0.1);
        }
        .phrase-card {
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            padding: 14px;
            margin-bottom: 8px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            position: relative;
        }
        .phrase-card .lang-tag {
            display: inline-block;
            font-size: 0.6875rem;
            padding: 2px 8px;
            border-radius: 10px;
            background: var(--primary-light);
            color: var(--primary-dark);
            font-weight: 600;
            margin-right: 6px;
        }
        .phrase-card .foreign-text {
            font-size: 1.125rem;
            font-weight: 700;
            margin: 6px 0 4px;
            color: var(--text);
        }
        .phrase-card .pron {
            font-size: 0.8125rem;
            color: var(--text-muted);
            margin-bottom: 2px;
        }
        .phrase-card .meaning {
            font-size: 0.875rem;
            color: var(--text);
        }
        .phrase-card .context {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
            font-style: italic;
        }
        .phrase-card .fav-btn {
            position: absolute;
            top: 10px;
            right: 12px;
            background: none;
            border: none;
            font-size: 1.25rem;
            cursor: pointer;
            opacity: 0.4;
            transition: opacity 0.15s;
        }
        .phrase-card .fav-btn.favorited { opacity: 1; }
        .phrase-card .speak-btn {
            position: absolute;
            top: 10px;
            right: 44px;
            background: none;
            border: none;
            font-size: 1.25rem;
            cursor: pointer;
            opacity: 0.5;
        }
        .emergency-fab {
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #ef4444;
            color: #fff;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(239,68,68,0.4);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .emergency-fab:active { transform: scale(0.9); }
        .emergency-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .emergency-modal.show { display: flex; }
        .emergency-modal .big-text {
            font-size: 2.5rem;
            font-weight: 900;
            color: #fff;
            text-align: center;
            margin-bottom: 16px;
        }
        .emergency-modal .close-btn {
            padding: 12px 32px;
            border-radius: 24px;
            border: 2px solid #fff;
            background: transparent;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="profile.html" class="header-avatar" title="个人信息">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
        </a>
        <a href="javascript:history.back()" class="header-back" title="返回"><svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></a>
        <h1>🌐 留学工具箱</h1>
    </div>
    <main class="tool-page" style="padding-bottom:80px;">
        <a href="javascript:history.back()" class="header-back" title="返回"><svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></a>
        <h1>🌐 应急翻译</h1>

        <div class="translate-area">
            <div class="lang-selector">
                <select id="fromLang"></select>
                <button class="swap-btn" onclick="swapLangs()" title="交换语言">⇄</button>
                <select id="toLang"></select>
            </div>
            <textarea id="translateInput" class="translate-input" rows="2" placeholder="输入想说的话..."></textarea>
            <button class="btn btn-primary" onclick="doTranslate()" style="width:auto;padding:10px 24px;">🔄 翻译</button>
            <div class="translate-result" id="translateResult">
                <div class="ru-text" id="resultText"></div>
                <div class="actions">
                    <button class="action-btn" onclick="speakResult()">🔊 朗读</button>
                    <button class="action-btn" onclick="copyResult()">📋 复制</button>
                    <button class="action-btn" id="favResultBtn" onclick="favResult()">⭐ 收藏</button>
                </div>
            </div>
        </div>

        <input type="text" class="search-box" id="searchBox" placeholder="🔍 搜索短语（中文/俄语/拼音）..." oninput="renderPhrases()">

        <div id="phraseList"></div>
    </main>

    <button class="emergency-fab" onclick="showEmergency()" title="紧急求助">🆘</button>
    <div class="emergency-modal" id="emergencyModal" onclick="hideEmergency()">
        <div class="big-text">🆘 ПОМОГИТЕ!</div>
        <div class="big-text" style="font-size:1.5rem;margin-bottom:8px;">Көмектесіңіз!</div>
        <div style="color:#fff;font-size:1rem;margin-bottom:8px;">帕马吉捷 / 科梅克捷西尼兹</div>
        <div style="color:#fff;opacity:0.7;margin-bottom:24px;">救命！帮帮我！</div>
        <button class="close-btn" onclick="event.stopPropagation();hideEmergency()">关闭</button>
    </div>

    <nav class="tab-bar">
        <a href="currency.html" class="tab-item">🪙<span>汇率</span></a>
        <a href="phrasebook.html" class="tab-item active">🌐<span>翻译</span></a>
        <a href="ledger.html" class="tab-item">💰<span>记账</span></a>
        <a href="knowledge.html" class="tab-item">📚<span>知识</span></a>
        <a href="timezone.html" class="tab-item">🕐<span>时区</span></a>
    </nav>

    <script src="app.js"></script>
    <script src="data/country-data.js"></script>
    <!-- 短语数据根据所选国家动态加载 -->
    <script id="phrasesScript"></script>
    <script>
        const MYMEMORY_API = 'https://api.mymemory.translated.net/get';
        let phrasesData = null;
        let lastTranslation = '';
        let favorites = JSON.parse(localStorage.getItem('phrase_favs') || '[]');

        // 所有留学国家语言
        const ALL_LANGS = [
            { code: 'zh', name: '中文', flag: '🇨🇳', api: 'zh-CN' },
            { code: 'en', name: '英语', flag: '🇬🇧', api: 'en-GB' },
            { code: 'ru', name: '俄语', flag: '🇷🇺', api: 'ru-RU' },
            { code: 'kk', name: '哈语', flag: '🇰🇿', api: 'kk-KZ' },
            { code: 'az', name: '阿塞拜疆语', flag: '🇦🇿', api: 'az-AZ' },
            { code: 'ja', name: '日语', flag: '🇯🇵', api: 'ja-JA' },
            { code: 'ko', name: '韩语', flag: '🇰🇷', api: 'ko-KR' },
            { code: 'de', name: '德语', flag: '🇩🇪', api: 'de-DE' },
            { code: 'fr', name: '法语', flag: '🇫🇷', api: 'fr-FR' },
            { code: 'ms', name: '马来语', flag: '🇲🇾', api: 'ms-MY' },
        ];

        const LANG_API_MAP = {};
        ALL_LANGS.forEach(l => { LANG_API_MAP[l.code] = l.api; });

        // 初始化翻译语言下拉框（双向都可选）
        (function initLangSelectors() {
            const fromSelect = document.getElementById('fromLang');
            const toSelect = document.getElementById('toLang');
            const country = getSelectedCountry();

            ALL_LANGS.forEach(l => {
                const opt1 = document.createElement('option');
                opt1.value = l.code;
                opt1.textContent = `${l.flag} ${l.name}`;
                fromSelect.appendChild(opt1);

                const opt2 = document.createElement('option');
                opt2.value = l.code;
                opt2.textContent = `${l.flag} ${l.name}`;
                toSelect.appendChild(opt2);
            });

            // 默认：中文 → 目标国家语言
            fromSelect.value = 'zh';
            if (country && country.languages.length > 0) {
                toSelect.value = country.languages[0].code;
            }
        })();

        function loadPhrases() {
            // 根据所选国家加载对应语言的短语
            const country = getSelectedCountry();
            const langCode = (country && country.languages[0]) ? country.languages[0].code : 'ru';

            // 俄语/哈语/阿塞拜疆语 → 完整版；其他 → 精简版
            const fullLangs = ['ru', 'kk', 'az'];
            const code = fullLangs.includes(langCode) ? langCode : (['en','ja','ko','de','fr','ms'].includes(langCode) ? langCode : 'en');

            const file = fullLangs.includes(code) ? 'phrases_embed.js' : `phrases_${code}.js`;

            const script = document.getElementById('phrasesScript');
            script.onload = () => {
                if (typeof PHRASES_DATA !== 'undefined') {
                    phrasesData = PHRASES_DATA;
                    renderPhrases();
                }
            };
            script.onerror = () => {
                document.getElementById('phraseList').innerHTML =
                    '<div class="empty-state"><p>短语数据加载失败，请检查网络</p></div>';
            };
            script.src = 'data/' + file;
        }

        function renderPhrases() {
            if (!phrasesData) return;
            const query = (document.getElementById('searchBox').value || '').toLowerCase().trim();
            let html = '';
            phrasesData.categories.forEach(cat => {
                let filtered = cat.phrases;
                if (query) {
                    filtered = cat.phrases.filter(p =>
                        p.zh.includes(query) || p.ru.toLowerCase().includes(query) ||
                        p.kk.toLowerCase().includes(query) || p.pronunciation.includes(query) ||
                        (p.tags || []).some(t => t.includes(query))
                    );
                }
                if (filtered.length === 0) return;
                const favPhrases = filtered.filter(p => favorites.includes(p.id));
                const normalPhrases = filtered.filter(p => !favorites.includes(p.id));
                const ordered = [...favPhrases, ...normalPhrases];

                html += `<div class="category-header">${cat.name} (${ordered.length})</div>`;
                ordered.forEach(p => {
                    const isFav = favorites.includes(p.id);
                    // 动态语言标签：根据所选国家生成
                    const country = getSelectedCountry();
                    const langTags = (country && country.languages)
                        ? country.languages.map(l => `<span class="lang-tag">${ALL_LANGS.find(a => a.code === l.code)?.flag || '🏳️'} ${l.name.slice(0,2)}</span>`).join('')
                        : '<span class="lang-tag">🇷🇺 俄</span><span class="lang-tag">🇰🇿 哈</span>';
                    // 第二行外文文本：只在和第一行不同时显示
                    const secondLine = p.kk !== p.ru ? `<div class="foreign-text" style="font-size:0.9375rem;font-weight:600;">${p.kk}</div>` : '';
                    html += `<div class="phrase-card" id="phrase-${p.id}">
                        ${langTags}
                        <button class="fav-btn ${isFav ? 'favorited' : ''}" onclick="toggleFav('${p.id}')">${isFav ? '⭐' : '☆'}</button>
                        <button class="speak-btn" onclick="speakPhrase('${p.id}')">🔊</button>
                        <div class="foreign-text">${p.ru}</div>
                        ${secondLine}
                        <div class="pron">📖 ${p.pronunciation}</div>
                        <div class="meaning">🇨🇳 ${p.zh}</div>
                        <div class="context">💡 ${p.context}</div>
                    </div>`;
                });
            });
            if (!html) html = '<div class="empty-state"><p>没有匹配的短语</p></div>';
            document.getElementById('phraseList').innerHTML = html;
        }

        function toggleFav(id) {
            if (favorites.includes(id)) {
                favorites = favorites.filter(f => f !== id);
            } else {
                favorites.unshift(id);
            }
            localStorage.setItem('phrase_favs', JSON.stringify(favorites));
            renderPhrases();
        }

        // 统一朗读：Android 原生 TTS + 语音可用性检测
        function doSpeak(text, lang) {
            if (window.AndroidTTS) {
                try {
                    var result = window.AndroidTTS.speak(text, lang);
                    if (result) {
                        try {
                            var r = JSON.parse(result);
                            if (r.status === 'SILENT' || r.status === 'MISSING' || r.status === 'UNSUPPORTED') {
                                if ('speechSynthesis' in window) {
                                    speakViaWebSpeech(text, lang);
                                } else {
                                    showInstallTTS();
                                }
                                return;
                            }
                        } catch(e) {}
                    }
                    return; // TTS OK, 正常播放
                } catch(e) {}
            }
            if ('speechSynthesis' in window) {
                speakViaWebSpeech(text, lang);
            }
        }

        function showInstallTTS() {
            // 不弹窗，静默标记为无语音（用户可看拼音发音）
        var ttsUnavailable = false;

        function showInstallTTS() {
            ttsUnavailable = true;
            // 更新所有朗读按钮显示
            var btns = document.querySelectorAll('.speak-btn');
            btns.forEach(function(b) { b.style.opacity = '0.25'; b.title = '语音包未安装（可看拼音发音）'; });
        }
        }

        function speakViaWebSpeech(text, lang) {
            speechSynthesis.cancel();
            var utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = 0.75;
            utterance.volume = 1.0;
            setTimeout(function() { speechSynthesis.speak(utterance); }, 50);
        }

        function showTTSMissing(lang) {
            var langNames = {'ru-RU':'俄语','kk-KZ':'哈语','az-AZ':'阿塞拜疆语','ja-JA':'日语','ko-KR':'韩语','de-DE':'德语','fr-FR':'法语','ms-MY':'马来语','en-GB':'英语','zh-CN':'中文'};
            var name = langNames[lang] || lang;
            var msg = '\u{1F50A} ' + name + '语音包未安装\n\n请在应用商店搜索：\n"Google 文字转语音"\n\n安装后去设置→语言和输入法→文字转语音→选择 Google TTS';
            if (confirm(msg)) {
                // 尝试打开 Google TTS 安装页
                window.open('https://play.google.com/store/apps/details?id=com.google.android.tts', '_blank');
            }
        }

        function speakPhrase(id) {
            const phrase = findPhrase(id);
            if (!phrase) return;
            doSpeak(phrase.ru, 'ru-RU');
        }

        function findPhrase(id) {
            if (!phrasesData) return null;
            for (const cat of phrasesData.categories) {
                const found = cat.phrases.find(p => p.id === id);
                if (found) return found;
            }
            return null;
        }

        async function doTranslate() {
            const text = document.getElementById('translateInput').value.trim();
            if (!text) return;
            const fromLang = document.getElementById('fromLang').value;
            const toLang = document.getElementById('toLang').value;
            const langpair = `${LANG_API_MAP[fromLang] || fromLang}|${LANG_API_MAP[toLang] || toLang}`;
            try {
                const res = await fetch(`${MYMEMORY_API}?q=${encodeURIComponent(text)}&langpair=${encodeURIComponent(langpair)}`);
                const data = await res.json();
                const translated = data.responseData?.translatedText || '翻译失败';
                lastTranslation = translated;
                document.getElementById('resultText').textContent = translated;
                document.getElementById('translateResult').style.display = 'block';
                document.getElementById('favResultBtn').textContent =
                    favorites.includes('custom_' + translated) ? '★ 已收藏' : '☆ 收藏';
            } catch (e) {
                document.getElementById('resultText').textContent = '翻译失败，请检查网络连接';
                document.getElementById('translateResult').style.display = 'block';
            }
        }

        function speakResult() {
            if (!lastTranslation) return;
            const toLang = document.getElementById('toLang').value;
            doSpeak(lastTranslation, LANG_API_MAP[toLang] || 'ru-RU');
        }

        function copyResult() {
            if (!lastTranslation) return;
            navigator.clipboard.writeText(lastTranslation).then(() => {
                const btns = document.querySelectorAll('#translateResult .action-btn');
                if (btns.length > 1) {
                    const orig = btns[1].textContent;
                    btns[1].textContent = '✅ 已复制';
                    setTimeout(() => { btns[1].textContent = orig; }, 1500);
                }
            });
        }

        function favResult() {
            if (!lastTranslation) return;
            const key = 'custom_' + lastTranslation;
            if (favorites.includes(key)) {
                favorites = favorites.filter(f => f !== key);
            } else {
                favorites.unshift(key);
            }
            localStorage.setItem('phrase_favs', JSON.stringify(favorites));
            document.getElementById('favResultBtn').textContent =
                favorites.includes(key) ? '★ 已收藏' : '☆ 收藏';
        }

        function swapLangs() {
            const from = document.getElementById('fromLang');
            const to = document.getElementById('toLang');
            const tmp = from.value;
            from.value = to.value;
            to.value = tmp;
        }

        function showEmergency() {
            document.getElementById('emergencyModal').classList.add('show');
            doSpeak('Помогите! Помогите!', 'ru-RU');
        }

        function hideEmergency() {
            document.getElementById('emergencyModal').classList.remove('show');
            if ('speechSynthesis' in window) speechSynthesis.cancel();
        }

        loadPhrases();
    </script>
</body>
</html>
