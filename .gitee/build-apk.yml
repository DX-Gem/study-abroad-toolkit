name: Build Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & Gradle
        run: |
          # Android SDK
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          curl -L -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>/dev/null
          # Gradle
          cd $HOME
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle.zip
          echo "export GRADLE_HOME=$HOME/gradle-8.5" >> $HOME/.bashrc
          echo "export ANDROID_HOME=$HOME/android-sdk" >> $HOME/.bashrc

      - name: Copy frontend to assets
        run: cp -r frontend/* android/app/src/main/assets/

      - name: Build APK
        run: |
          cd android
          $GRADLE_HOME/bin/gradle assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 留学工具箱-APK
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
