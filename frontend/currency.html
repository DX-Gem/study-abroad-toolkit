<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汇率换算器 — 留学工具箱</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f97316">
</head>
<body>
            <div class="header">
        <a href="index.html" class="header-back" title="返回首页"><svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></a>
        <h1></h1>
        <a href="notifications.html" class="header-notify" title="消息"><svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg><span class="badge" id="notifyBadge">0</span></a>
        <a href="profile.html" class="header-avatar" title="个人信息"><svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg></a>
    </div>

    <main class="tool-page">
        <h1>🪙 汇率换算器</h1>

        <div class="form-group">
            <label for="amount">金额</label>
            <input type="number" id="amount" value="100" min="0" step="0.01" placeholder="输入金额">
        </div>

        <div class="form-group">
            <label for="fromCurrency">从</label>
            <select id="fromCurrency"></select>
        </div>

        <button class="swap-btn" onclick="swapCurrencies()" style="display:block;margin:0 auto 8px;width:40px;height:40px;border-radius:50%;border:2px solid var(--border);background:var(--card-bg);font-size:1.25rem;cursor:pointer;" title="交换货币">⇄</button>

        <div class="form-group">
            <label for="toCurrency">到</label>
            <select id="toCurrency"></select>
        </div>

        <button class="btn btn-primary" onclick="convertCurrency()">换算</button>

        <div class="result-card" id="resultCard" style="display:none;">
            <h3>换算结果</h3>
            <div class="value" id="resultValue"></div>
            <div class="subtitle" id="resultRate"></div>
        </div>

        <div class="result-card" id="ratesCard" style="margin-top:24px;">
            <h3>当前汇率 · 1 CNY =</h3>
            <div class="currency-grid" id="ratesGrid">
                <div class="empty-state">
                    <div class="empty-icon">⏳</div>
                    <p>加载中...</p>
                </div>
            </div>
            <div class="subtitle" style="margin-top:8px;text-align:center;" id="ratesUpdated"></div>
        </div>

        <div class="result-card" style="margin-top:16px;">
            <h3>💡 自定义汇率对比</h3>
            <p class="subtitle" style="margin-bottom:8px;">
                输入你实际换到的汇率（比如黑市汇率），看看和官方差多少
            </p>
            <div class="form-group">
                <label for="customRate">1 CNY = ? KZT（自定义）</label>
                <input type="number" id="customRate" value="68" min="0" step="0.01" placeholder="输入自定义汇率">
            </div>
            <div id="customResult" class="subtitle" style="margin-top:8px;"></div>
        </div>
    </main>

    <div class="footer">
        <p>数据来源：exchangerate-api.com · 每小时更新 · <strong>仅供参考</strong></p>
    </div>

    <script src="data/country-data.js"></script>
    <script>
        const EXCHANGE_API = 'https://api.exchangerate-api.com/v4/latest/USD';
        let currentRates = {};
        let usdRates = {};

        // 双向下拉框：从→到，任意货币互转
        (function initCurrency() {
            const fromSelect = document.getElementById('fromCurrency');
            const toSelect = document.getElementById('toCurrency');
            const seen = new Set();

            // 收集所有可用货币
            const allCurrencies = [];
            COUNTRIES.forEach(c => {
                if (!seen.has(c.currency.code)) {
                    seen.add(c.currency.code);
                    allCurrencies.push(c);
                }
            });

            // 填充两个下拉框
            allCurrencies.forEach(c => {
                const optText = `${c.flag} ${c.currency.code} — ${c.currency.name}`;
                const opt1 = document.createElement('option');
                opt1.value = c.currency.code;
                opt1.textContent = optText;
                fromSelect.appendChild(opt1);

                const opt2 = document.createElement('option');
                opt2.value = c.currency.code;
                opt2.textContent = optText;
                toSelect.appendChild(opt2);
            });

            const country = getSelectedCountry();
            fromSelect.value = 'CNY';
            toSelect.value = country ? country.currency.code : 'USD';
        })();

        // 页面加载时获取汇率（直连 exchangerate-api.com）
        async function loadRates() {
            // 先尝试读缓存
            const cached = JSON.parse(localStorage.getItem('cached_rates_v2') || 'null');
            if (cached && (Date.now() - cached.ts < 3600000)) {
                usdRates = cached.usd;
                currentRates = cached.cny;
                renderRatesGrid({ rates: currentRates, updated: cached.date });
            }

            try {
                const res = await fetch(EXCHANGE_API);
                const data = await res.json();
                usdRates = data.rates;
                // 转为 CNY 基准
                const cnyRate = data.rates['CNY'];
                const cnyRates = {};
                for (const [code, rate] of Object.entries(data.rates)) {
                    cnyRates[code] = code === 'CNY' ? 1 : +(rate / cnyRate).toFixed(6);
                }
                currentRates = cnyRates;
                // 存入缓存
                localStorage.setItem('cached_rates_v2', JSON.stringify({
                    usd: data.rates, cny: cnyRates, date: data.date, ts: Date.now()
                }));
                renderRatesGrid({ rates: cnyRates, updated: data.date });
            } catch (err) {
                if (!cached) {
                    document.getElementById('ratesGrid').innerHTML =
                        '<div class="empty-state"><div class="empty-icon">⚠️</div><p style="color:#ef4444;">汇率加载失败，请检查网络连接</p></div>';
                }
            }
        }

        function renderRatesGrid(data) {
            const grid = document.getElementById('ratesGrid');
            const currencyInfo = {
                CNY: '人民币',
                KZT: '哈萨克斯坦坚戈',
                AZN: '阿塞拜疆马纳特',
                RUB: '俄罗斯卢布',
                USD: '美元',
                EUR: '欧元',
            };
            // 只显示支持的货币
            const showCodes = ['KZT', 'AZN', 'RUB', 'USD', 'EUR'];

            grid.innerHTML = showCodes
                .filter(code => data.rates[code] != null)
                .map((code) => {
                    const rate = data.rates[code];
                    const name = currencyInfo[code] || code;
                    return `
                        <div class="currency-item">
                            <div class="currency-code">${name}</div>
                            <div class="currency-rate">${rate.toFixed(2)}</div>
                            <div style="font-size:0.75rem;color:var(--text-muted);margin-top:2px;">${code}</div>
                        </div>`;
                })
                .join('');

            document.getElementById('ratesUpdated').textContent =
                `更新于 ${data.updated || '最近'}`;
        }

        // 交换 from 和 to 货币
        function swapCurrencies() {
            const from = document.getElementById('fromCurrency');
            const to = document.getElementById('toCurrency');
            const tmp = from.value;
            from.value = to.value;
            to.value = tmp;
            convertCurrency();
        }

        // 前端直接换算（无需后端）
        function convertCurrency() {
            const amount = parseFloat(document.getElementById('amount').value) || 100;
            const from = document.getElementById('fromCurrency').value;
            const to = document.getElementById('toCurrency').value;

            if (!usdRates[from] || !usdRates[to]) {
                document.getElementById('resultValue').textContent = '汇率数据未加载，请刷新页面';
                return;
            }

            // from → USD → to
            const amountInUsd = amount / usdRates[from];
            const result = +(amountInUsd * usdRates[to]).toFixed(2);
            const rate = +(usdRates[to] / usdRates[from]).toFixed(6);

            const currencySymbols = {
                CNY: '¥', KZT: '₸', RUB: '₽', USD: '$', EUR: '€',
                AZN: '₼', GBP: '£', JPY: '¥', KRW: '₩',
                CAD: 'C$', AUD: 'A$', SGD: 'S$', MYR: 'RM'
            };

            document.getElementById('resultCard').style.display = 'block';
            document.getElementById('resultValue').textContent =
                `${currencySymbols[from] || ''}${amount} = ${currencySymbols[to] || ''}${result.toLocaleString()}`;
            document.getElementById('resultRate').textContent =
                `汇率：1 ${from} = ${rate} ${to}`;

            // 自定义汇率计算
            updateCustomCompare(from, to, amount, rate);
        }

        function updateCustomCompare(from, to, amount, officialRate) {
            const labelEl = document.querySelector('label[for="customRate"]');
            if (labelEl) labelEl.textContent = `1 ${from} = ? ${to}（自定义）`;
            const customRate = parseFloat(document.getElementById('customRate').value) || 0;
            if (customRate <= 0) return;

            const officialResult = amount * officialRate;
            const customResult = amount * customRate;
            const diff = customResult - officialResult;
            const pct = officialResult > 0 ? ((diff / officialResult) * 100).toFixed(1) : 0;

            const emoji = diff > 0 ? '🟢' : diff < 0 ? '🔴' : '⚪';
            document.getElementById('customResult').innerHTML = `
                官方：<strong>${officialResult.toFixed(2)} ${to}</strong><br>
                自定义：<strong>${customResult.toFixed(2)} ${to}</strong><br>
                差额：${emoji} ${diff > 0 ? '+' : ''}${diff.toFixed(2)} ${to} (${pct}%)
            `;
        }

        // 自定义汇率输入时实时更新
        // 切换货币时更新自定义汇率标签
        ['fromCurrency', 'toCurrency'].forEach(id => {
            document.getElementById(id).addEventListener('change', () => {
                const amount = document.getElementById('amount').value || 100;
                const from = document.getElementById('fromCurrency').value;
                const to = document.getElementById('toCurrency').value;
                const officialRate = (usdRates[from] && usdRates[to]) ? +(usdRates[to] / usdRates[from]).toFixed(6) : 0;
                updateCustomCompare(from, to, amount, officialRate);
            });
        });

        document.getElementById('customRate').addEventListener('input', () => {
            const amount = document.getElementById('amount').value || 100;
            const from = document.getElementById('fromCurrency').value;
            const to = document.getElementById('toCurrency').value;
            // 计算 from→to 的汇率
            const officialRate = (usdRates[from] && usdRates[to]) ? +(usdRates[to] / usdRates[from]).toFixed(6) : 0;
            updateCustomCompare(from, to, amount, officialRate);
        });

        // 页面加载
        loadRates();
    </script>
    <script src="app.js"></script>

  <script src="update-checker.js"></script>
</body>
