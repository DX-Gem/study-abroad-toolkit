<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>选择留学目的地 — 留学工具箱</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff6b35">
    <style>
        .select-hero {
            text-align: center;
            padding: 40px 24px 32px;
            background: linear-gradient(135deg, #ff6b35 0%, #ff8c5a 50%, #e55a2b 100%);
            color: #fff;
            margin-bottom: 8px;
            border-radius: 0 0 32px 32px;
            position: relative;
            overflow: hidden;
        }
        .select-hero::before {
            content: '';
            position: absolute;
            top: -60px; right: -30px;
            width: 150px; height: 150px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
        }
        .select-hero h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 4px;
            position: relative;
        }
        .select-hero p {
            font-size: 0.875rem;
            opacity: 0.85;
            position: relative;
        }
        .country-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 16px 16px 24px;
            max-width: 640px;
            margin: 0 auto;
        }
        .country-card {
            background: var(--card-bg-solid);
            border-radius: var(--radius);
            padding: 20px 12px;
            text-align: center;
            border: 1.5px solid var(--border-light);
            cursor: pointer;
            transition: all var(--transition);
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }
        .country-card:active {
            transform: scale(0.94);
            border-color: var(--primary);
            box-shadow: var(--shadow-md);
            background: var(--primary-light);
        }
        .country-card .flag {
            font-size: 2.75rem;
            display: block;
            margin-bottom: 6px;
            transition: transform var(--transition);
        }
        .country-card:active .flag { transform: scale(1.1); }
        .country-card .name {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 2px;
            color: var(--text);
        }
        .country-card .currency {
            font-size: 0.6875rem;
            color: var(--text-muted);
        }
        .country-card .cost {
            font-size: 0.625rem;
            color: var(--primary-dark);
            margin-top: 6px;
            background: var(--primary-ghost);
            padding: 2px 8px;
            border-radius: 10px;
            display: inline-block;
        }
        .current-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--success);
            color: #fff;
            font-size: 0.625rem;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="select-hero">
        <h1>🌍 你要去哪里留学？</h1>
        <p>选择目的地，工具箱自动适配当地货币、时区、语言</p>
    </div>

    <div class="country-grid" id="countryGrid"></div>

    <div class="footer">
        <p>DX-GEM · 留学工具箱 v1.0</p>
    </div>

    <script src="data/country-data.js"></script>
    <script>
        function renderCountries() {
            const grid = document.getElementById('countryGrid');
            const currentId = localStorage.getItem('selected_country');

            // 按洲分组排序
            const asia = COUNTRIES.filter(c => c.continent === '亚洲');
            const europe = COUNTRIES.filter(c => c.continent === '欧洲');
            const americas = COUNTRIES.filter(c => c.continent.includes('北美'));
            const oceania = COUNTRIES.filter(c => c.continent === '大洋洲');
            const other = COUNTRIES.filter(c =>
                !c.continent.includes('亚洲') && !c.continent.includes('欧洲') &&
                !c.continent.includes('北美') && !c.continent.includes('大洋洲')
            );

            const ordered = [...asia, ...europe, ...americas, ...oceania, ...other];

            grid.innerHTML = ordered.map(c => `
                <div class="country-card" onclick="selectCountry('${c.id}')">
                    ${c.id === currentId ? '<span class="current-badge">当前</span>' : ''}
                    <span class="flag">${c.flag}</span>
                    <div class="name">${c.name}</div>
                    <div class="currency">${c.currency.symbol} ${c.currency.name}</div>
                    <div class="cost">${c.cost.city} · ${c.cost.monthly}/月</div>
                </div>
            `).join('');
        }

        function selectCountry(id) {
            setSelectedCountry(id);
            // 跳转主页
            window.location.href = 'index.html';
        }

        renderCountries();
    </script>
    <script src="app.js"></script>
    <script src="update-checker.js"></script>
</body>
</html>
