<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>欢迎 — 留学工具箱</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#E76F51">
    <style>
        body {
            background: linear-gradient(180deg, #FFF5F0 0%, #FFFAF7 40%, #FFF0E8 100%);
            position: relative;
            overflow-x: hidden;
        }
        /* 背景装饰花纹 */
        body::before {
            content: '';
            position: fixed;
            top: -80px; right: -60px;
            width: 200px; height: 200px;
            background: radial-gradient(circle, rgba(231,111,81,0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none; z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: 10%; left: -40px;
            width: 160px; height: 160px;
            background: radial-gradient(circle, rgba(244,162,97,0.05) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none; z-index: 0;
        }
        .onboard-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0 20px;
            max-width: 420px;
            margin: 0 auto;
            position: relative; z-index: 1;
        }
        .onboard-hero {
            text-align: center;
            padding: 56px 20px 36px;
            position: relative;
        }
        /* Logo 光环 */
        .onboard-hero .logo-wrap {
            display: inline-block;
            position: relative;
            margin-bottom: 16px;
        }
        .onboard-hero .logo {
            font-size: 3.5rem;
            display: block;
            position: relative; z-index: 1;
            animation: scaleIn 0.6s ease-out;
        }
        .onboard-hero .logo-ring {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90px; height: 90px;
            border-radius: 50%;
            border: 2px dashed rgba(231,111,81,0.2);
            animation: spin 20s linear infinite;
        }
        @keyframes spin { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
        .onboard-hero h1 {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #E76F51, #F4A261);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 2px;
        }
        .onboard-hero p {
            font-size: 0.875rem;
            color: var(--text-muted);
        }
        /* 装饰分隔线 */
        .section-divider {
            display: flex; align-items: center; gap: 10px;
            margin: 8px 0 16px;
        }
        .section-divider::before, .section-divider::after {
            content: ''; flex: 1; height: 1px;
            background: linear-gradient(90deg, transparent, var(--border), transparent);
        }
        .section-divider span {
            font-size: 0.75rem; color: var(--text-muted);
        }
        .onboard-card {
            background: var(--card-bg-solid);
            border-radius: var(--radius-lg);
            padding: 24px 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
            margin-bottom: 14px;
            position: relative;
            border-left: 4px solid var(--primary);
            transition: all var(--transition);
        }
        .onboard-card:nth-child(2) { border-left-color: var(--accent); }
        .onboard-card:nth-child(3) { border-left-color: var(--accent-dark); }
        .onboard-card h2 {
            font-size: 1.125rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 1rem;
            background: var(--bg);
            color: var(--text);
            transition: all var(--transition);
            font-family: inherit;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(255,107,53,0.1);
        }
        .btn-start {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: var(--radius);
            background: linear-gradient(135deg, #ff6b35, #e55a2b);
            color: #fff;
            font-size: 1.125rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(255,107,53,0.3);
            transition: all var(--transition);
            margin-top: 8px;
            margin-bottom: 32px;
        }
        .btn-start:active { transform: scale(0.96); opacity: 0.9; }
        .skip-link {
            text-align: center;
            display: block;
            color: var(--text-muted);
            font-size: 0.8125rem;
            text-decoration: none;
            padding: 12px;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>
    <div class="onboard-container">
        <div class="onboard-hero">
            <div class="logo-wrap">
                <div class="logo-ring"></div>
                <span class="logo">🧰</span>
            </div>
            <h1>留学工具箱</h1>
            <p>填写基本信息，为你定制专属工具</p>
        </div>

        <div class="onboard-card">
            <h2>👤 基本信息</h2>
            <div class="form-group">
                <label>你的名字</label>
                <input type="text" id="userName" placeholder="输入你的名字或昵称" autocomplete="name">
            </div>
        </div>

        <div class="onboard-card">
            <h2>🌍 留学目的地</h2>
            <div class="form-group">
                <label>选择国家</label>
                <select id="userCountry"></select>
            </div>
        </div>

        <div class="onboard-card">
            <h2>📅 留学计划</h2>
            <div class="form-group">
                <label>出发日期</label>
                <input type="date" id="userDate">
            </div>
            <div class="form-group">
                <label>月预算（人民币）</label>
                <input type="number" id="userBudget" placeholder="例如：5000" inputmode="numeric">
            </div>
        </div>

        <div class="onboard-card" style="border-left-color:#9B59B6;">
            <h2>🔐 注册社区账号 <span style="font-size:0.6875rem;font-weight:400;color:var(--text-muted);">— 和全球留学生交流</span></h2>
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" id="userEmail" placeholder="your@email.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="userPassword" placeholder="至少6位" autocomplete="new-password">
            </div>
            <p style="font-size:0.75rem;color:var(--text-muted);margin-top:-4px;">注册后可使用朋友圈、好友等社区功能</p>
        </div>

        <button class="btn-start" id="btnStart" onclick="saveAndEnter()">🚀 开始使用</button>
        <div id="registerMsg" style="text-align:center;font-size:0.8125rem;margin-top:-4px;min-height:20px;"></div>
        <a class="skip-link" href="select.html">跳过，直接选国家 →</a>
    </div>

    <script src="data/country-data.js"></script>
    <script>
        var API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
            ? 'http://localhost:8000' : '';

        // 填充国家下拉框
        (function() {
            var select = document.getElementById('userCountry');
            COUNTRIES.forEach(function(c) {
                var opt = document.createElement('option');
                opt.value = c.id;
                opt.textContent = c.flag + ' ' + c.name + ' — ' + c.currency.name;
                select.appendChild(opt);
            });
            select.value = 'kazakhstan';
        })();

        async function saveAndEnter() {
            var btn = document.getElementById('btnStart');
            var msgEl = document.getElementById('registerMsg');
            var name = document.getElementById('userName').value.trim();
            var country = document.getElementById('userCountry').value;
            var date = document.getElementById('userDate').value;
            var budget = document.getElementById('userBudget').value;
            var email = document.getElementById('userEmail').value.trim();
            var password = document.getElementById('userPassword').value;

            // 如果填了邮箱，先注册社区账号
            if (email && password) {
                if (password.length < 6) {
                    msgEl.textContent = '密码至少6位';
                    msgEl.style.color = 'var(--error)';
                    return;
                }
                btn.disabled = true;
                btn.textContent = '正在注册...';
                msgEl.textContent = '';
                msgEl.style.color = '';

                try {
                    var res = await fetch(API_BASE + '/api/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: email, password: password, name: name || email.split('@')[0] })
                    });
                    var data = await res.json();
                    if (!res.ok) throw new Error(data.detail || '注册失败');

                    // 自动登录
                    localStorage.setItem('auth_token', data.token);
                    localStorage.setItem('auth_user', JSON.stringify(data.user));
                    msgEl.textContent = '账号注册成功！';
                    msgEl.style.color = 'var(--success)';
                } catch (err) {
                    msgEl.textContent = '注册失败: ' + err.message + ' · 基本信息已保存';
                    msgEl.style.color = '#e67e22';
                }
                btn.disabled = false;
                btn.textContent = '🚀 开始使用';
            }

            // 保存用户信息
            var profile = {
                name: name || '同学',
                country: country,
                departureDate: date || '',
                monthlyBudget: parseInt(budget) || 0,
                setupAt: new Date().toISOString()
            };
            localStorage.setItem('user_profile', JSON.stringify(profile));
            localStorage.setItem('selected_country', country);

            // 同步出发日期到倒计时
            if (date) {
                var cd = JSON.parse(localStorage.getItem('countdown_data') || 'null');
                if (!cd) {
                    cd = { departure_date: date, destination: '', tasks: [] };
                } else {
                    cd.departure_date = date;
                }
                var c = COUNTRIES.find(function(x) { return x.id === country; });
                if (c) cd.destination = c.name + (c.timezone ? ' (' + c.timezone.city + ')' : '');
                localStorage.setItem('countdown_data', JSON.stringify(cd));
            }

            // 同步预算到记账本
            if (budget && parseInt(budget) > 0) {
                var ledger = JSON.parse(localStorage.getItem('ledger_data') || '{"records":[],"settings":{"monthly_budget_cny":3000,"default_currency":"KZT"}}');
                ledger.settings.monthly_budget_cny = parseInt(budget);
                var c = COUNTRIES.find(function(x) { return x.id === country; });
                if (c) ledger.settings.default_currency = c.currency.code;
                localStorage.setItem('ledger_data', JSON.stringify(ledger));
            }

            // 跳转主页
            window.location.href = 'index.html';
        }
    </script>
    <script src="app.js"></script>
    <script src="update-checker.js"></script>
</body>
</html>
