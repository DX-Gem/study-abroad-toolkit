<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>个人信息 — 留学工具箱</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff6b35">
    <style>
        .profile-avatar {
            width: 72px; height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b35, #e55a2b);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem;
            margin: 0 auto 12px;
            font-weight: 800;
            box-shadow: 0 8px 24px rgba(255,107,53,0.3);
        }
        .profile-card {
            background: var(--card-bg-solid);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }
        .profile-card h3 {
            font-size: 0.9375rem;
            margin-bottom: 12px;
            color: var(--text-muted);
        }
        .info-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0; border-bottom: 1px solid var(--border-light);
        }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: var(--text-muted); font-size: 0.875rem; }
        .info-value { font-weight: 600; font-size: 0.9375rem; text-align: right; }
        .country-switch-btn {
            display: block; width: 100%; padding: 12px;
            border: 2px dashed var(--primary); border-radius: var(--radius-sm);
            background: var(--primary-light); color: var(--primary-dark);
            font-weight: 700; font-size: 0.9375rem; cursor: pointer;
            text-align: center; text-decoration: none; margin-top: 8px;
            transition: all var(--transition);
        }
        .country-switch-btn:active { background: var(--primary); color: #fff; }
        .reset-btn {
            display: block; width: 100%; padding: 12px; margin-top: 8px;
            border: 2px solid var(--border); border-radius: var(--radius-sm);
            background: transparent; color: var(--text-muted);
            font-size: 0.8125rem; cursor: pointer; text-align: center;
        }
        .album-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 12px;
        }
        .album-item {
            aspect-ratio: 1;
            border-radius: var(--radius-sm);
            overflow: hidden;
            position: relative;
            background: var(--border-light);
        }
        .album-item img {
            width: 100%; height: 100%;
            object-fit: cover;
        }
        .album-item .del-photo {
            position: absolute;
            top: 4px; right: 4px;
            width: 24px; height: 24px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            color: #fff;
            border: none;
            font-size: 0.75rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .add-photo-btn {
            display: flex; align-items: center; justify-content: center;
            aspect-ratio: 1;
            border: 2px dashed var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 2rem;
            color: var(--text-muted);
            transition: all var(--transition);
        }
        .add-photo-btn:active { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
        #photoInput { display: none; }
    </style>
</head>
<body>
            <div class="header">
        <a href="index.html" class="header-back" title="返回首页"><svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></a>
        <h1></h1>
        <a href="notifications.html" class="header-notify" title="消息"><svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg><span class="badge" id="notifyBadge">0</span></a>
        <a href="profile.html" class="header-avatar" title="个人信息"><svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg></a>
    </div>
    <main class="tool-page" style="padding-bottom:80px;">
        <h1>👤 个人信息</h1>

        <div id="profileContent"></div>
    </main>

    <nav class="tab-bar">
        <a href="currency.html" class="tab-item">🪙<span>汇率</span></a>
        <a href="phrasebook.html" class="tab-item">🌐<span>翻译</span></a>
        <a href="community.html" class="tab-item">👥<span>社区</span></a>
        <a href="knowledge.html" class="tab-item">📚<span>知识</span></a>
        <a href="ledger.html" class="tab-item">💰<span>记账</span></a>
    </nav>

    <script src="data/country-data.js"></script>
    <script>
        function renderProfile() {
            var profile = JSON.parse(localStorage.getItem('user_profile') || '{}');
            var country = getSelectedCountry();
            var name = profile.name || '未设置';
            var initial = name.charAt(0).toUpperCase();
            var container = document.getElementById('profileContent');

            var html = '<div style="text-align:center;padding:16px 0;">' +
                '<div class="profile-avatar">' + initial + '</div>' +
                '<div style="font-size:1.25rem;font-weight:700;">' + name + '</div>' +
                '<div style="font-size:0.875rem;color:var(--text-muted);margin-top:4px;">' +
                (country ? country.flag + ' ' + country.name + ' 留学中' : '未设置目的地') +
                '</div></div>';

            html += '<div class="profile-card"><h3>📋 基本信息</h3>';
            html += '<div class="info-row"><span class="info-label">名字</span><span class="info-value">' + name + '</span></div>';
            html += '<div class="info-row"><span class="info-label">目的地</span><span class="info-value">' + (country ? country.flag + ' ' + country.name : '未设置') + '</span></div>';
            html += '<div class="info-row"><span class="info-label">出发日期</span><span class="info-value">' + (profile.departureDate || '未设置') + '</span></div>';
            html += '<div class="info-row"><span class="info-label">月预算</span><span class="info-value">' + (profile.monthlyBudget ? '¥' + profile.monthlyBudget : '未设置') + '</span></div>';
            html += '</div>';

            // 留学信息
            if (country) {
                html += '<div class="profile-card"><h3>🌍 留学概况</h3>';
                html += '<div class="info-row"><span class="info-label">货币</span><span class="info-value">' + country.currency.symbol + ' ' + country.currency.name + '</span></div>';
                html += '<div class="info-row"><span class="info-label">时区</span><span class="info-value">' + country.timezone.utc + '</span></div>';
                html += '<div class="info-row"><span class="info-label">语言</span><span class="info-value">' + country.languages.map(function(l) { return l.name; }).join(' / ') + '</span></div>';
                html += '<div class="info-row"><span class="info-label">月生活费</span><span class="info-value">' + country.cost.monthly + '</span></div>';
                html += '</div>';
            }

            html += '<a class="country-switch-btn" href="select.html">🔄 切换留学目的地</a>';
            html += '<button class="reset-btn" onclick="resetProfile()">🔄 重新设置个人信息</button>';

            // 相册
            html += '<div class="profile-card"><h3>📷 留学相册</h3><div class="album-grid" id="albumGrid"></div></div>';

            container.innerHTML = html;
            renderAlbum();
        }

        // ===== 相册功能 =====
        function getPhotos() {
            try { return JSON.parse(localStorage.getItem('album_photos') || '[]'); }
            catch(e) { return []; }
        }
        function savePhotos(photos) {
            localStorage.setItem('album_photos', JSON.stringify(photos));
        }

        function addPhoto() {
            var input = document.getElementById('photoInput');
            if (!input) {
                input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.id = 'photoInput';
                input.style.display = 'none';
                input.onchange = function(e) {
                    var file = e.target.files[0];
                    if (!file) return;
                    var reader = new FileReader();
                    reader.onload = function(ev) {
                        var photos = getPhotos();
                        photos.unshift({
                            id: Date.now(),
                            data: ev.target.result,
                            date: new Date().toISOString().slice(0,10)
                        });
                        // 限制最多50张，防爆localStorage
                        if (photos.length > 50) photos = photos.slice(0,50);
                        savePhotos(photos);
                        renderAlbum();
                    };
                    reader.readAsDataURL(file);
                };
                document.body.appendChild(input);
            }
            input.click();
        }

        function deletePhoto(id) {
            if (!confirm('删除这张照片？')) return;
            var photos = getPhotos().filter(function(p) { return p.id !== id; });
            savePhotos(photos);
            renderAlbum();
        }

        function renderAlbum() {
            var grid = document.getElementById('albumGrid');
            if (!grid) return;
            var photos = getPhotos();
            var html = '<div class="add-photo-btn" onclick="addPhoto()">+</div>';
            photos.forEach(function(p) {
                html += '<div class="album-item"><img src="' + p.data + '" loading="lazy"><button class="del-photo" onclick="event.stopPropagation();deletePhoto(' + p.id + ')">✕</button></div>';
            });
            grid.innerHTML = html;
        }

        function resetProfile() {
            if (confirm('确定要重新设置吗？将跳转到引导页重新填写。')) {
                localStorage.removeItem('user_profile');
                localStorage.removeItem('selected_country');
                window.location.href = 'onboarding.html';
            }
        }

        renderProfile();
    </script>
    <script src="app.js"></script>
    <script src="update-checker.js"></script>
</body>
</html>
