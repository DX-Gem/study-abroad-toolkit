<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留学工具箱 — 中亚留学生的一站式实用工具</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <h1>🧰 留学工具箱</h1>
        <p>中亚留学生的一站式实用工具</p>
    </div>

    <div class="hero">
        <span class="hero-icon">🎓</span>
        <h2>留学准备，一站搞定</h2>
        <p>汇率、花费、时区、行李 — 四个工具，帮你轻松出发</p>
    </div>

    <div class="tools-grid">
        <a href="currency.html" class="tool-card">
            <div class="icon">🪙</div>
            <div class="card-text">
                <h2>汇率换算器</h2>
                <p>人民币 ↔ 坚戈/卢布/美元/欧元 实时换算</p>
            </div>
            <span class="arrow">→</span>
        </a>
        <a href="cost.html" class="tool-card">
            <div class="icon">📊</div>
            <div class="card-text">
                <h2>生活成本计算器</h2>
                <p>估算目标城市每月花费，做好预算</p>
            </div>
            <span class="arrow">→</span>
        </a>
        <a href="timezone.html" class="tool-card">
            <div class="icon">🕐</div>
            <div class="card-text">
                <h2>时区转换器</h2>
                <p>跨国时间对照 + 课程表规划</p>
            </div>
            <span class="arrow">→</span>
        </a>
        <a href="packing.html" class="tool-card">
            <div class="icon">🎒</div>
            <div class="card-text">
                <h2>行李清单生成器</h2>
                <p>按目的地和季节自动生成打包清单</p>
            </div>
            <span class="arrow">→</span>
        </a>
    </div>

    <div class="footer">
        <p>Study Abroad Toolkit · 让留学准备更简单</p>
    </div>
</body>
</html>
